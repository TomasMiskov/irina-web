<span class="theme-picker">
  <button type="button" class="theme-picker__current" aria-haspopup="true" aria-expanded="false" aria-label="Choose seasonal theme">🌱</button>
  <span class="theme-picker__menu" role="menu">
    <button type="button" data-season="winter" role="menuitemradio" aria-checked="false" aria-label="Winter">❄️</button>
    <button type="button" data-season="spring" role="menuitemradio" aria-checked="false" aria-label="Spring">🌱</button>
    <button type="button" data-season="summer" role="menuitemradio" aria-checked="false" aria-label="Summer">☀️</button>
    <button type="button" data-season="autumn" role="menuitemradio" aria-checked="false" aria-label="Autumn">🍂</button>
  </span>
</span>
